# German recipe: distil a compact German ModernBERT student from ModernGBERT-1B
# with MiniLMv2 relation distillation. Using the ModernGBERT 31k tokenizer keeps
# the student small. Relation-only (no logit-KD) for a lean, fast objective;
# add logit-KD via loss.logit_kd_weight if you want to compare.
name: german_moderngbert
teacher: LSX-UniWue/ModernGBERT_1B              # German ModernBERT, 28L/2048H, 31k vocab
student_architecture: LSX-UniWue/ModernGBERT_1B # small ModernBERT, German 31k tokenizer (keeps the student tiny)
output: ./models/german_moderngbert

data:
  dataset: HuggingFaceFW/fineweb-2
  config: deu_Latn                              # many German shards -> streaming parallelises, no pack-cache needed
  max_seq_len: 512
  pack: true

student:
  hidden: 384
  layers: 6
  heads: 6
  L: 22                                          # ModernGBERT upper global layer (global every 3rd: 1,4,...,28)
  A_r: 16                                         # divides 2048 (teacher) and 384 (student)

loss:
  relations: "{(1,1):1,(2,2):1,(3,3):1}"         # MiniLMv2 Q-Q/K-K/V-V

training:
  batch: 64
  grad_accum: 4                                   # effective batch 256
  max_steps: 6000                                 # a short, economical budget; raise for higher quality
  lr: 6e-4
  warmup: 1500
  save_steps: 1000                                # frequent, cheap checkpoints (quick to resume if interrupted)
  compile: true                                   # compile_loss + compile_teacher (teacher truncated at L)
