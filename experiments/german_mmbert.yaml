# German recipe with the multilingual mmBERT-base teacher (MiniLMv2 relation
# distillation). The student inherits mmBERT's 256k vocab, so the embedding
# table dominates its size; prune it (below) for a compact German-only model.
# Prefer german_moderngbert.yaml unless the multilingual vocab is needed.
name: german_mmbert
teacher: jhu-clsp/mmBERT-base                   # multilingual ModernBERT, 22L/768H, 256k vocab
student_architecture: jhu-clsp/mmBERT-base
output: ./models/german_mmbert

data:
  dataset: HuggingFaceFW/fineweb-2
  config: deu_Latn
  max_seq_len: 512
  pack: true

student:
  hidden: 384
  layers: 6
  heads: 6
  L: 19                                          # mmBERT upper global layer (global every 3rd: 1,4,...,22)
  A_r: 16                                          # divides 768 (teacher) and 384 (student)
  # For a compact German deployment, prune the 256k vocab to a German subset
  # (~30-40k -> student drops from ~106M to ~25M params). Compatible with
  # relation-only distillation; uncomment to enable:
  # prune_vocab: 40000
  # prune_vocab_coverage: 0.999

loss:
  relations: "{(1,1):1,(2,2):1,(3,3):1}"

training:
  batch: 64
  grad_accum: 4
  max_steps: 6000
  lr: 6e-4
  warmup: 1500
  save_steps: 1000
  compile: true
