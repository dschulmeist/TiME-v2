# Run 1/4 - ModernGBERT-1B teacher, MiniLMv2 relation distillation only.
name: run1_moderngbert_relation
teacher: LSX-UniWue/ModernGBERT_1B          # German ModernBERT, 28L/2048H, 31k vocab, no GQA
student_architecture: LSX-UniWue/ModernGBERT_1B   # student is a small ModernBERT, German tokenizer
output: ./models/run1_moderngbert_relation

data:
  dataset: HuggingFaceFW/fineweb-2
  config: deu_Latn                          # German; many shards -> streaming parallelises, no pack-cache needed
  max_seq_len: 512
  pack: true

student:
  hidden: 384
  layers: 6
  heads: 6
  L: 22                                      # ModernGBERT global layers: 1,4,...,28 -> upper global = 22
  A_r: 16                                    # divides 2048 (teacher) and 384 (student)

loss:
  relations: "{(1,1):1,(2,2):1,(3,3):1}"     # MiniLMv2 Q-Q/K-K/V-V

training:
  batch: 64
  grad_accum: 4                              # effective batch 256
  max_steps: 15000
  lr: 6e-4
  warmup: 1500
  save_steps: 2500
  compile: true                             # compile_loss + compile_teacher (teacher truncated at L=22)
