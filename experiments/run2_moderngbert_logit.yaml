# Run 2/4 - ModernGBERT-1B teacher, relation distillation + output-logit KD.
# Identical to run 1 except the added logit-KD term, which also forces the
# FULL teacher to run (no truncation) since it needs the MLM head's logits.
# Teacher/student share the 31k German vocab, so logit-KD aligns cleanly.
name: run2_moderngbert_logit
teacher: LSX-UniWue/ModernGBERT_1B
student_architecture: LSX-UniWue/ModernGBERT_1B
output: ./models/run2_moderngbert_logit

data:
  dataset: HuggingFaceFW/fineweb-2
  config: deu_Latn
  max_seq_len: 512
  pack: true

student:
  hidden: 384
  layers: 6
  heads: 6
  L: 22
  A_r: 16

loss:
  relations: "{(1,1):1,(2,2):1,(3,3):1}"
  logit_kd_weight: 1.0                       # + MLM-logit KD (31k vocab is cheap)
  logit_kd_temperature: 2.0

training:
  batch: 64
  grad_accum: 4
  max_steps: 15000
  lr: 6e-4
  warmup: 1500
  save_steps: 2500
  compile: true                             # compile_loss + compile_teacher (full teacher; no truncation)
